# Publishes the project page at https://raytrunk.github.io/quillpad/.
# Needs Settings > Pages > Source: GitHub Actions, once.
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, docs/screenshots/**, assets/quillpad.png, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the page
        run: |
          mkdir _site
          cp -r site/* _site/
          cp -r docs/screenshots _site/screenshots
          cp assets/quillpad.png _site/icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
